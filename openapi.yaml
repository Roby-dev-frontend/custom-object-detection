openapi: 3.1.0
info:
  title: Telecamera API
  description: Every route except POST /login needs a logged-in session (cookie from POST /login); the
    administration routes also need an administrator. Generated by scripts/export_openapi.py -- do not
    edit by hand. WebSocket routes are under x-websockets.
  version: 0.1.0
paths:
  /login:
    post:
      summary: Login
      operationId: login_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Login Login Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /logout:
    post:
      summary: Logout
      operationId: logout_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
                title: Response Logout Logout Post
  /me:
    get:
      summary: Me
      description: 'The page calls this when it loads, to decide whether to show the login

        form or the camera. The administration page calls it to decide whether to

        render anything at all -- though the real check is on every endpoint, not

        here: this answer only saves it drawing a panel it may not use.'
      operationId: me_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Me Me Get
  /me/password:
    post:
      summary: Change Own Password
      operationId: change_own_password_me_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
                title: Response Change Own Password Me Password Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users:
    get:
      summary: Get Users
      operationId: get_users_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Users Users Get
    post:
      summary: Add User
      operationId: add_user_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUserRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Add User Users Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users/{username}:
    delete:
      summary: Remove User
      operationId: remove_user_users__username__delete
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Remove User Users  Username  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users/{username}/role:
    patch:
      summary: Change Role
      operationId: change_role_users__username__role_patch
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Change Role Users  Username  Role Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users/{username}/name:
    patch:
      summary: Rename User
      operationId: rename_user_users__username__name_patch
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Rename User Users  Username  Name Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users/{username}/password:
    post:
      summary: Reset Password
      operationId: reset_password_users__username__password_post
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPasswordRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                title: Response Reset Password Users  Username  Password Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users/{username}/logout_everywhere:
    post:
      summary: Logout User Everywhere
      operationId: logout_user_everywhere_users__username__logout_everywhere_post
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                title: Response Logout User Everywhere Users  Username  Logout Everywhere Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /me/logout_everywhere:
    post:
      summary: Logout My Other Sessions
      description: Ends the OTHER sessions of this account and keeps this one.
      operationId: logout_my_other_sessions_me_logout_everywhere_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
                title: Response Logout My Other Sessions Me Logout Everywhere Post
  /objects/frames:
    post:
      summary: Capture Object Frames
      operationId: capture_object_frames_objects_frames_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Capture Object Frames Objects Frames Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects:
    get:
      summary: Get Objects
      operationId: get_objects_objects_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Objects Objects Get
    post:
      summary: Create Object
      operationId: create_object_objects_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewObjectRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Object Objects Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/transfer/export:
    post:
      summary: Prepare Classifier Export
      description: 'Builds the export file and keeps it for five minutes; the answer carries

        the token for GET /objects/transfer/export/{token}.'
      operationId: prepare_classifier_export_objects_transfer_export_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Prepare Classifier Export Objects Transfer Export Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/transfer/export/{token}:
    get:
      summary: Download Classifier Export
      description: 'The file, once. It is unlinked as soon as it is open (Linux keeps it

        readable until the last byte is sent), so a download that is cut off leaves

        nothing on the disk.'
      operationId: download_classifier_export_objects_transfer_export__token__get
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/transfer/upload:
    put:
      summary: Upload Classifier Import
      description: 'Takes an export file as the raw request body, checks everything in it,

        and answers with the preview. Nothing is written to the store yet.'
      operationId: upload_classifier_import_objects_transfer_upload_put
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Upload Classifier Import Objects Transfer Upload Put
  /objects/transfer/{token}/plan:
    post:
      summary: Plan Classifier Import
      description: The preview again, under other options (which rows, skip, merge into).
      operationId: plan_classifier_import_objects_transfer__token__plan_post
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOptions'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Plan Classifier Import Objects Transfer  Token  Plan Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/transfer/{token}/apply:
    post:
      summary: Apply Classifier Import
      description: 'Writes the previewed classifiers into the store. Additive: nothing already

        here is changed or removed, and nothing is made active for detection.'
      operationId: apply_classifier_import_objects_transfer__token__apply_post
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Apply Classifier Import Objects Transfer  Token  Apply Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/transfer/{token}:
    delete:
      summary: Cancel Classifier Transfer
      description: Throws a staged file away. Already gone is not an error.
      operationId: cancel_classifier_transfer_objects_transfer__token__delete
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                title: Response Cancel Classifier Transfer Objects Transfer  Token  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/{object_id}:
    get:
      summary: Get One Object
      description: 'One object WITH its photographs listed.


        Separate from the list above because the list is fetched constantly and

        only needs counts, while this is fetched when somebody actually opens one.'
      operationId: get_one_object_objects__object_id__get
      parameters:
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          title: Object Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get One Object Objects  Object Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      summary: Rename Object
      description: Administrators only, and the name is all it changes.
      operationId: rename_object_objects__object_id__patch
      parameters:
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          title: Object Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameObjectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Rename Object Objects  Object Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Remove Object
      operationId: remove_object_objects__object_id__delete
      parameters:
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          title: Object Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Remove Object Objects  Object Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/{object_id}/views:
    post:
      summary: Add Object Views
      description: A burst of photographs of one named object. Every operator may add.
      operationId: add_object_views_objects__object_id__views_post
      parameters:
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          title: Object Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectViewsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Add Object Views Objects  Object Id  Views Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/views/{view_name}:
    delete:
      summary: Remove Object View
      description: 'One photograph, and everything recorded about it.


        require_session, not require_admin: curating the photos YOU took -- taking

        a bad one back out -- is part of gathering them, not undoing somebody

        else''s work. Deleting a photo somebody else contributed is still an

        administrator''s job, checked below, for the same reason renaming and

        deleting a whole classifier are.


        Nothing else has to be remembered here: the box lives on the same row, so

        a picture and what was known about it cannot come apart.'
      operationId: remove_object_view_objects_views__view_name__delete
      parameters:
      - name: view_name
        in: path
        required: true
        schema:
          type: string
          title: View Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Remove Object View Objects Views  View Name  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/view/{view_name}:
    get:
      summary: Object View
      description: 'One stored photograph. The name is matched against the pattern we

        generate, never joined onto a directory.'
      operationId: object_view_objects_view__view_name__get
      parameters:
      - name: view_name
        in: path
        required: true
        schema:
          type: string
          title: View Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/{object_id}/template-refs:
    put:
      summary: Set Template Refs
      description: 'Curation, so require_session and not require_admin -- the same rule the

        box endpoint follows, and for the same reason: it changes nothing the house

        detects until an administrator measures and activates again. The response

        says so through detector.template_stale.'
      operationId: set_template_refs_objects__object_id__template_refs_put
      parameters:
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          title: Object Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRefsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Set Template Refs Objects  Object Id  Template Refs Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/{object_id}/augment:
    post:
      summary: Augment Object
      description: 'Makes extra photographs out of the boxed ones, for the references to

        cover more than one lighting.


        require_admin, like /objects/measure and unlike capturing: it is seconds of

        CPU per press and it adds rows to everybody''s classifier, which is not the

        same kind of act as contributing a photograph of your own.'
      operationId: augment_object_objects__object_id__augment_post
      parameters:
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          title: Object Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AugmentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Augment Object Objects  Object Id  Augment Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/{object_id}/generated:
    delete:
      summary: Remove Generated Views
      description: 'Takes every generated photograph of one classifier back out.


        The originals stay. An active measurement made against variants is not

        re-run here -- it keeps its pinned references like any other, and

        get_object reports the ones that no longer exist, same as for a photo

        deleted by hand.'
      operationId: remove_generated_views_objects__object_id__generated_delete
      parameters:
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          title: Object Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Remove Generated Views Objects  Object Id  Generated Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/views/{view_name}/box:
    post:
      summary: Set Object View Box
      description: 'Where the object is, in one photograph already saved to the classifier.


        require_session, like adding a view: drawing the box is finishing the

        photograph you or someone else just contributed, not undoing anybody''s

        work, so it is not an administrator''s job the way deleting one is.'
      operationId: set_object_view_box_objects_views__view_name__box_post
      parameters:
      - name: view_name
        in: path
        required: true
        schema:
          type: string
          title: View Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewBox'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Set Object View Box Objects Views  View Name  Box Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/measure:
    post:
      summary: Measure Object
      description: 'Which way of finding this object actually works, as numbers.


        require_admin, unlike capturing. Gathering photographs is everybody''s job

        -- that is the entire point of one database and many users -- but this

        burns whole seconds of CPU per press, and leaving it open to every operator

        would hand anybody a way to make the video stutter for the whole house.'
      operationId: measure_object_objects_measure_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasureRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Measure Object Objects Measure Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/{object_id}/activate:
    post:
      summary: Activate Classifier
      description: 'Turns one Misura result into the thing live detection trusts.


        Deliberately a second, explicit step rather than Misura auto-adopting

        whichever method separated best: a later Misura run -- after a worse

        photo was added, say -- would otherwise silently replace a detector that

        was working. The administrator decides when a result is good enough to

        go live, same as they decide everything else that changes what the whole

        house detects.


        Re-runs the ONE chosen method itself, through the same

        _gather_measurement_inputs every Misura press uses, rather than trusting

        numbers the client could have sent: the server''s own numbers are what

        gets stored, never the caller''s.'
      operationId: activate_classifier_objects__object_id__activate_post
      parameters:
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          title: Object Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Activate Classifier Objects  Object Id  Activate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /objects/sheet/{name}:
    get:
      summary: Object Sheet
      description: One contact sheet from the last measurement.
      operationId: object_sheet_objects_sheet__name__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /command:
    post:
      summary: Run Command
      operationId: run_command_command_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Run Command Command Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /detections:
    post:
      summary: Report Detections
      description: 'Where the browser sends what it detected, so the server can act on it.


        The page draws its own boxes; nothing here affects what it displays. This

        exists purely so detection moving off the Pi does not also move it out of

        reach of the hardware attached to the Pi.'
      operationId: report_detections_detections_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectionsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Report Detections Detections Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /presence:
    post:
      summary: Presence
      description: 'Heartbeat. Every open page calls this every few seconds; the answer is

        the list of devices, so one round trip both registers and refreshes.


        It also carries the state that lives on the SERVER and is shared by every

        page: which camera is selected and what is being detected. Each page used

        to keep private copies of those, so a page never learned that another one

        had changed them -- which is why picking a different detection class on one

        device left the others detecting the old one, and why a freshly opened page

        reset the camera source and cut off whoever was sharing.'
      operationId: presence_presence_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Presence Presence Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stop_sharing:
    post:
      summary: Stop Sharing
      description: 'Ends whoever''s share is currently running, from any device.


        Without this a viewer is stuck: the publisher owns the single stream, so

        everyone else watches a camera they cannot turn off, and the only way out

        was to walk over to the sharing device.'
      operationId: stop_sharing_stop_sharing_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Stop Sharing Stop Sharing Post
  /devices:
    get:
      summary: Connected Devices
      description: 'The device list, read WITHOUT registering the caller as a device.


        /presence is a heartbeat: it registers whoever calls it. The

        administration page only wants to look, and a page that appeared in its own

        list -- and could be asked to share its own camera -- would be confusing

        rather than useful.'
      operationId: connected_devices_devices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Connected Devices Devices Get
  /admin/notifications:
    get:
      summary: List Notifications
      description: 'Events worth an administrator''s attention, until one of them dismisses

        each -- see notifications.py. Separate from the admin page''s own LIVE

        checks (a classifier with too many photos, say), which are computed fresh

        from objects.py each time rather than stored here.'
      operationId: list_notifications_admin_notifications_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Notifications Admin Notifications Get
  /admin/notifications/{notification_id}/dismiss:
    post:
      summary: Dismiss Notification
      operationId: dismiss_notification_admin_notifications__notification_id__dismiss_post
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
          title: Notification Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Dismiss Notification Admin Notifications  Notification Id  Dismiss Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/notifications/dismiss_all:
    post:
      summary: Dismiss All Notifications
      description: 'Clears the whole list in one go. Not an error when it was already empty:

        the page offers the button from a count it read seconds ago, and somebody

        else dismissing the last one in between is not a failure of this request.'
      operationId: dismiss_all_notifications_admin_notifications_dismiss_all_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Dismiss All Notifications Admin Notifications Dismiss All Post
  /share_request:
    post:
      summary: Share Request
      description: 'Asks one device to turn its camera on and send it here.


        Two limits that are the browser''s, not this server''s, and cannot be coded

        around: the tab that captures shows a recording indicator, and the

        operating system may show its own light -- nothing can be put on the page

        to remove those. And getUserMedia only succeeds without a click on a device

        that has already granted this site camera permission persistently, so this

        works on a device that has shared before and cannot be made to work on one

        that never has.'
      operationId: share_request_share_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Share Request Share Request Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /source:
    post:
      summary: Set Source
      operationId: set_source_source_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Set Source Source Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /video_encoding:
    post:
      summary: Set Video Encoding
      operationId: set_video_encoding_video_encoding_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoEncodingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Set Video Encoding Video Encoding Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /camera_devices:
    get:
      summary: Camera Devices
      operationId: camera_devices_camera_devices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Camera Devices Camera Devices Get
  /detection_classes:
    get:
      summary: Detection Classes
      description: 'The COCO classes yolov8n can detect, so the frontend''s picker stays in

        sync with COCO_CLASSES instead of hardcoding a copy that could drift out

        of step with the indices the backend actually filters on.'
      operationId: detection_classes_detection_classes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Detection Classes Detection Classes Get
  /models/{name}:
    get:
      summary: Browser Model
      operationId: browser_model_models__name__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /video_feed:
    get:
      summary: Video Feed
      operationId: video_feed_video_feed_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /detections_saved:
    get:
      summary: List Saved Detections
      operationId: list_saved_detections_detections_saved_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Saved Detections Detections Saved Get
    delete:
      summary: Clear Saved Detections
      description: '"Svuota": deletes, for every device, the pictures created at or before

        `before` (ms) -- the newest one the page was showing. Anyone logged in may,

        as anyone may delete one picture with its X.'
      operationId: clear_saved_detections_detections_saved_delete
      parameters:
      - name: before
        in: query
        required: true
        schema:
          type: integer
          title: Before
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                title: Response Clear Saved Detections Detections Saved Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ocr:
    post:
      summary: Read Text
      description: 'The text in one picture. Stores nothing and logs only how many lines and

        how long: what a camera is pointed at may be somebody''s letter.'
      operationId: read_text_ocr_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Read Text Ocr Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ocr/save:
    post:
      summary: Save Read Text
      description: 'Keeps a read: the picture with the lines boxed, where it was taken, and

        the text in a field of its own. It goes into the same store and the same

        strip as a saved detection, so deleting it, clearing the strip and the map

        link all work without a second code path.


        The text is taken from the request and NOT read again: a second read would

        cost another second and could differ from what the person just looked at.'
      operationId: save_read_text_ocr_save_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrSaveRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Save Read Text Ocr Save Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /detections_saved/{entry_id}/text:
    patch:
      summary: Correct Saved Text
      description: Replaces the words of a saved text entry -- for correcting a misread.
      operationId: correct_saved_text_detections_saved__entry_id__text_patch
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          title: Entry Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryTextRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Correct Saved Text Detections Saved  Entry Id  Text Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /detections_saved/{entry_id}.jpg:
    get:
      summary: Saved Detection Jpeg
      operationId: saved_detection_jpeg_detections_saved__entry_id__jpg_get
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          title: Entry Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /detections_saved/{entry_id}:
    delete:
      summary: Delete Saved Detection
      operationId: delete_saved_detection_detections_saved__entry_id__delete
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          title: Entry Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                title: Response Delete Saved Detection Detections Saved  Entry Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActivateRequest:
      properties:
        method:
          type: string
          title: Method
      type: object
      required:
      - method
      title: ActivateRequest
    ApplyRequest:
      properties:
        only:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 200
          - type: 'null'
          title: Only
        skip_existing:
          type: boolean
          title: Skip Existing
          default: false
        into:
          additionalProperties:
            type: string
          type: object
          maxProperties: 200
          title: Into
        plan_digest:
          type: string
          maxLength: 64
          title: Plan Digest
      type: object
      required:
      - plan_digest
      title: ApplyRequest
    AugmentRequest:
      properties:
        kinds:
          items:
            type: string
            enum:
            - bright
            - dark
            - contrast
            - blur
            - colour
          type: array
          title: Kinds
      type: object
      title: AugmentRequest
      description: 'Which transforms to apply. Empty means all five.


        A Literal list rather than free text: the names index a dict of functions

        in object_augment, and an unknown one should be refused by pydantic before

        this code runs.'
    CaptureRequest:
      properties:
        into:
          type: string
          enum:
          - with
          - without
          title: Into
        images:
          items:
            type: string
          type: array
          title: Images
      type: object
      required:
      - into
      - images
      title: CaptureRequest
      description: 'Frames to keep, and which of the two sets they belong to.


        `into` is a Literal rather than a string: the value becomes a directory

        name, and a caller-supplied path here would reach faces.db and .env. Two

        words are the entire vocabulary, so pydantic refuses everything else before

        this code ever runs -- the same reasoning as the allow-list in

        /models/{name} and the name pattern in /faces/photo/{name}.'
    CommandRequest:
      properties:
        command:
          type: string
          enum:
          - button1
          - button2
          - button3
          title: Command
      type: object
      required:
      - command
      title: CommandRequest
    DetectionConfigRequest:
      properties:
        backend:
          anyOf:
          - type: string
            enum:
            - mediapipe
            - yolo
            - face
            - classifier
          - type: 'null'
          title: Backend
        yolo_classes:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Yolo Classes
        location:
          anyOf:
          - type: string
            enum:
            - browser
            - server
          - type: 'null'
          title: Location
        num_hands:
          anyOf:
          - type: integer
            enum:
            - 1
            - 2
          - type: 'null'
          title: Num Hands
        object_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Object Id
        active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Active
      type: object
      title: DetectionConfigRequest
      description: 'Mirrors detection.DETECTION_CONFIG. Every field optional so callers can

        send just the part they want to change.'
    DetectionsRequest:
      properties:
        source:
          type: string
          enum:
          - picamera
          - usb
          - remote
          title: Source
        detections:
          items:
            $ref: '#/components/schemas/ReportedDetection'
          type: array
          title: Detections
      type: object
      required:
      - source
      - detections
      title: DetectionsRequest
    EntryTextRequest:
      properties:
        text:
          type: string
          maxLength: 20000
          minLength: 1
          title: Text
      type: object
      required:
      - text
      title: EntryTextRequest
    ExportRequest:
      properties:
        ids:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 1000
          - type: 'null'
          title: Ids
      type: object
      title: ExportRequest

        Several rather than one because averaging the embeddings across a short

        burst is what makes recognition survive a phone being carried while

        walking -- measured worst case improves from 0.539 to 0.594, with no rise

        in the score against strangers.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginRequest
    MeasureRequest:
      properties:
        object_id:
          type: string
          title: Object Id
      type: object
      required:
      - object_id
      title: MeasureRequest
    NewObjectRequest:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: NewObjectRequest
    NewPasswordRequest:
      properties:
        new_password:
          type: string
          title: New Password
      type: object
      required:
      - new_password
      title: NewPasswordRequest
    NewUserRequest:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        is_admin:
          type: boolean
          title: Is Admin
          default: false
      type: object
      required:
      - username
      - password
      title: NewUserRequest
    ObjectViewsRequest:
      properties:
        images:
          items:
            type: string
          type: array
          title: Images
      type: object
      required:
      - images
      title: ObjectViewsRequest
    OcrLine:
      properties:
        text:
          type: string
          maxLength: 1000
          title: Text
        box:
          items:
            type: integer
          type: array
          maxItems: 4
          minItems: 4
          title: Box
      type: object
      required:
      - text
      - box
      title: OcrLine
    OcrPosition:
      properties:
        lat:
          type: number
          title: Lat
        lon:
          type: number
          title: Lon
        accuracy:
          anyOf:
          - type: number
          - type: 'null'
          title: Accuracy
      type: object
      required:
      - lat
      - lon
      title: OcrPosition
    OcrRequest:
      properties:
        image:
          type: string
          maxLength: 900000
          title: Image
        mode:
          type: string
          enum:
          - scene
          - text
          - codes
          title: Mode
          default: scene
        sharpen:
          type: boolean
          title: Sharpen
          default: false
      type: object
      required:
      - image
      title: OcrRequest
    OcrSaveRequest:
      properties:
        image:
          type: string
          maxLength: 900000
          title: Image
        mode:
          type: string
          enum:
          - scene
          - text
          - codes
          title: Mode
          default: scene
        lines:
          items:
            $ref: '#/components/schemas/OcrLine'
          type: array
          maxItems: 200
          minItems: 1
          title: Lines
        position:
          anyOf:
          - $ref: '#/components/schemas/OcrPosition'
          - type: 'null'
        text:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
          title: Text
      type: object
      required:
      - image
      - lines
      title: OcrSaveRequest
    PasswordChangeRequest:
      properties:
        current_password:
          type: string
          title: Current Password
        new_password:
          type: string
          title: New Password
      type: object
      required:
      - current_password
      - new_password
      title: PasswordChangeRequest
    PresenceRequest:
      properties:
        client_id:
          type: string
          title: Client Id
        label:
          type: string
          title: Label
        upload_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Upload Ms
      type: object
      required:
      - client_id
      - label
      title: PresenceRequest
    RenameObjectRequest:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: RenameObjectRequest
    RenameRequest:
      properties:
        new_username:
          type: string
          title: New Username
      type: object
      required:
      - new_username
      title: RenameRequest
    ReportedDetection:
      properties:
        label:
          type: string
          title: Label
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
        bbox:
          anyOf:
          - prefixItems:
            - type: integer
            - type: integer
            - type: integer
            - type: integer
            type: array
            maxItems: 4
            minItems: 4
          - type: 'null'
          title: Bbox
      type: object
      required:
      - label
      title: ReportedDetection
      description: 'One detection as the page found it. Same shape as detection.Detection,

        so browser-side and server-side results are interchangeable.'
    RoleRequest:
      properties:
        role:
          type: string
          title: Role
      type: object
      required:
      - role
      title: RoleRequest
    ShareRequest:
      properties:
        client_id:
          type: string
          title: Client Id
      type: object
      required:
      - client_id
      title: ShareRequest
    SourceRequest:
      properties:
        source:
          type: string
          enum:
          - picamera
          - usb
          - remote
          - none
          title: Source
        shared:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Shared
        client_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Client Id
        device_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Device Index
        detection_config:
          anyOf:
          - $ref: '#/components/schemas/DetectionConfigRequest'
          - type: 'null'
      type: object
      required:
      - source
      title: SourceRequest
    TemplateRefsRequest:
      properties:
        views:
          items:
            type: string
          type: array
          title: Views
      type: object
      title: TemplateRefsRequest
      description: 'Which photos the template method may use, in the order chosen.


        An empty list means "stop choosing": template then falls back to the first

        few boxed photos, which is what it did before anybody could choose.'
    TransferOptions:
      properties:
        only:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 200
          - type: 'null'
          title: Only
        skip_existing:
          type: boolean
          title: Skip Existing
          default: false
        into:
          additionalProperties:
            type: string
          type: object
          maxProperties: 200
          title: Into
      type: object
      title: TransferOptions
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VideoEncodingRequest:
      properties:
        width:
          type: integer
          maximum: 1920.0
          minimum: 0.0
          title: Width
          default: 0
        quality:
          type: integer
          maximum: 100.0
          minimum: 30.0
          title: Quality
          default: 95
      type: object
      title: VideoEncodingRequest
      description: 'How the local camera''s frames should be encoded from now on.


        Four rungs are offered in the page; anything in range is accepted here.

        The floor is not arbitrary: a watching page runs face detection at 640 px

        and hand detection at 480 px and never scales a picture UP, so sending less

        than 320 px would start starving the detector rather than merely softening

        the picture.'
    ViewBox:
      properties:
        x:
          type: integer
          title: X
        y:
          type: integer
          title: Y
        w:
          type: integer
          title: W
        h:
          type: integer
          title: H
      type: object
      required:
      - x
      - y
      - w
      - h
      title: ViewBox
      description: Where the object is, in the pixels of the picture it was drawn on.
x-websockets:
  /video_ws:
    authentication: session cookie and page origin checked on the handshake; refused with close code 4401
    summary: The video of the server's camera, one frame per request.
    direction: server -> page, a frame at a time, only when the page asks
    query:
      client: id of the viewing page
      buffer: seconds of footage to keep, 0 drops late frames (default 0)
    source: server_fastapi.py, video_ws
  /camera_feed:
    authentication: session cookie and page origin checked on the handshake; refused with close code 4401
    summary: A device uploads its own camera, for the others to watch.
    direction: page -> server, JPEG frames
    query:
      client: id of the publishing page
    source: server_fastapi.py, camera_feed
  /detect_ws:
    authentication: session cookie and page origin checked on the handshake; refused with close code 4401
    summary: A page sends its own frames and gets detections (or text) back.
    direction: page -> server frames; server -> page messages
    query:
      client: id of the page (cut to 64 characters)
      save: 0 = show only, anything else = also save to the strip
      mode: text = text reading instead of objects
    source: server_fastapi.py, detect_ws
  /camera_detect_ws:
    authentication: session cookie and page origin checked on the handshake; refused with close code 4401
    summary: 'Detect (and save) from the server''s own camera: nothing is uploaded.'
    direction: 'server -> page: only ''ready'' and ''saved'''
    query:
      save: 0 = show only, anything else = also save to the strip
      mode: text = text reading instead of objects
    source: server_fastapi.py, camera_detect_ws
